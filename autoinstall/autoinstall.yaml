#cloud-config
# -------------------------------------------------------
# Généré par generate.sh — NE PAS MODIFIER DIRECTEMENT
# Modifier les variables dans generate.sh puis relancer
# Ubuntu 26.04 LTS Resolute Raccoon
# -------------------------------------------------------
autoinstall:
  version: 1

  packages:
    - ubuntu-desktop
    - curl
    - git
    - vim
    - htop
    - net-tools

  snaps:
    - name: firefox
    - name: gtk-common-themes
    - name: snap-store
    - name: snapd-desktop-integration

  identity:
    realname: ''
    username: cyber
    password: "$6$WMR3CJcOLfzrGDI8$PzYmJsWJXLXB.3ugTq9hl/FgXiz2OiP6JnmZyUmhi77TwdrmC/3qh7XCdzHUZXBem0QZobY7J5n9Y9Mws4KyG/"
    hostname: ubuntoutou

  keyboard:
    layout: fr
    variant: ''

  locale: fr_FR.UTF-8

  timezone: Europe/Paris

  network:
    ethernets:
      eth0:
        dhcp4: true
    version: 2

  storage:
    version: 1
    config:
      - type: disk
        id: disk0
        path: /dev/sda
        ptable: gpt
        wipe: superblock
        grub_device: false

      - type: partition
        id: part-efi
        device: disk0
        size: 512M
        flag: boot
        grub_device: true

      - type: partition
        id: part-boot
        device: disk0
        size: 1G

      - type: partition
        id: part-lvm
        device: disk0
        size: -1
        flag: linux-lvm

      - type: lvm_volgroup
        id: vg0
        name: vg-ubuntu
        devices:
          - part-lvm

      - type: lvm_partition
        id: lv-swap
        volgroup: vg0
        name: lv-swap
        size: 4G

      - type: lvm_partition
        id: lv-root
        volgroup: vg0
        name: lv-root
        size: 30G

      - type: lvm_partition
        id: lv-home
        volgroup: vg0
        name: lv-home
        size: -1

      - type: format
        id: fmt-efi
        volume: part-efi
        fstype: fat32
        label: EFI

      - type: format
        id: fmt-boot
        volume: part-boot
        fstype: ext4
        label: boot

      - type: format
        id: fmt-swap
        volume: lv-swap
        fstype: swap
        label: swap

      - type: format
        id: fmt-root
        volume: lv-root
        fstype: ext4
        label: root

      - type: format
        id: fmt-home
        volume: lv-home
        fstype: ext4
        label: home

      - type: mount
        id: mnt-efi
        device: fmt-efi
        path: /boot/efi

      - type: mount
        id: mnt-boot
        device: fmt-boot
        path: /boot

      - type: mount
        id: mnt-swap
        device: fmt-swap
        path: none

      - type: mount
        id: mnt-root
        device: fmt-root
        path: /

      - type: mount
        id: mnt-home
        device: fmt-home
        path: /home

  user-data:
    chpasswd:
      list: |
        root:$6$YHqwp43CP4Xjq1su$W3C07Zh2eLRiukgyw9TBQiYapJKO06g6TFeKO7y4leckKDVAjSyQae4tlZgtpN/Ak16QcIeYlBMhMnEjjnnyE1
      expire: false
    users:
      - name: root
        lock_passwd: false

  kernel:
    flavor: hwe

  late-commands:
    - >-
      curtin in-target --
      sed -i /etc/default/grub -e
      's/GRUB_CMDLINE_LINUX_DEFAULT=".*/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"/'
    - >-
      curtin in-target --
      sed -i /etc/default/grub -e
      's/^#\?GRUB_TIMEOUT=.*/GRUB_TIMEOUT=5/'
    - >-
      curtin in-target --
      sed -i /etc/default/grub -e
      's/^#\?GRUB_TIMEOUT_STYLE=.*/GRUB_TIMEOUT_STYLE=hidden/'
    - >-
      curtin in-target --
      sed -i /etc/default/grub -e
      's/^#\?GRUB_TERMINAL=.*/GRUB_TERMINAL=console/'
    - >-
      curtin in-target --
      sed -i /etc/default/grub -e
      's/^#\?GRUB_DISABLE_OS_PROBER=.*/GRUB_DISABLE_OS_PROBER=true/'
    - curtin in-target -- update-grub
    - rm /target/etc/netplan/00-installer-config*yaml
    - >-
      printf "network:\n  version: 2\n  renderer: NetworkManager"
      > /target/etc/netplan/01-network-manager-all.yaml
    - sed -i 's/^#\?PermitRootLogin.*/PermitRootLogin yes/' /target/etc/ssh/sshd_config
    - >-
      curtin in-target -- apt-get remove -y
      ubuntu-server ubuntu-server-minimal
      binutils byobu curl dmeventd finalrd gawk
      kpartx mdadm ncurses-term needrestart open-iscsi openssh-server
      sg3-utils ssh-import-id sssd thin-provisioning-tools vim tmux
      sosreport screen open-vm-tools motd-news-config lxd-agent-loader
      landscape-common htop git fonts-ubuntu-console ethtool
    - curtin in-target -- apt-get install -y cloud-init
    - curtin in-target -- apt-get autoremove -y

  updates: security

  shutdown: reboot
